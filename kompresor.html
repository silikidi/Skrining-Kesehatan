<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Media Processor v3.0 - Final</title>
    
    <link rel="stylesheet" href="./dist/tailwind.css">
    <link rel="stylesheet" href="../css/sweetalert2.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf_viewer.min.css">
    
    <script src="../js/sweetalert2.all.min.js"></script>
    <script src="../js/modern-screenshot4.6.8.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    
    <style>
        /* Optimasi Scroll & Layout Mobile */
        @media (max-width: 768px) {
            #app { height: auto; min-height: 100vh; display: flex; flex-direction: column; }
            #preview-section { order: 2; min-height: 60vh; }
            #sidebar-section { order: 1; shrink: 0; }
        }
        canvas { max-width: 100%; height: auto !important; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-0 md:p-6 flex items-center justify-center">

    <div id="app" class="hidden w-full max-w-7xl bg-white rounded-none md:rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row h-screen md:h-[92vh]">
        
        <div id="sidebar-section" class="w-full md:w-80 bg-slate-50 p-6 border-b md:border-b-0 md:border-r border-slate-200 flex flex-col shrink-0">
            <div class="mb-8">
                <h1 class="text-2xl font-black text-indigo-600 tracking-tighter uppercase leading-none">Media System</h1>
                <p class="text-[10px] font-bold text-slate-400 mt-2 tracking-widest uppercase">Local Client Processing</p>
            </div>

            <div class="space-y-6 flex-1 overflow-y-auto custom-scrollbar pr-1">
                <div>
                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3">Tingkat Kompresi</p>
                    <div class="space-y-2">
                        <label class="block p-3 border rounded-xl bg-white cursor-pointer has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50 transition shadow-sm">
                            <input type="radio" name="lvl" value="low" class="hidden">
                            <span class="block text-sm font-bold">Low Compression</span>
                            <span class="text-[10px] text-slate-400 italic">Kualitas HQ, File Besar</span>
                        </label>
                        <label class="block p-3 border rounded-xl bg-white cursor-pointer has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50 transition shadow-sm">
                            <input type="radio" name="lvl" value="med" checked class="hidden">
                            <span class="block text-sm font-bold">Medium</span>
                            <span class="text-[10px] text-slate-400 italic">Standar Optimal</span>
                        </label>
                        <label class="block p-3 border rounded-xl bg-white cursor-pointer has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50 transition shadow-sm">
                            <input type="radio" name="lvl" value="high" class="hidden">
                            <span class="block text-sm font-bold">High Compression</span>
                            <span class="text-[10px] text-slate-400 italic">File Kecil, Kualitas Rendah</span>
                        </label>
                    </div>
                </div>

                <div id="drop-zone" class="border-2 border-dashed border-slate-300 p-8 rounded-2xl text-center hover:bg-white hover:border-indigo-400 cursor-pointer transition-all">
                    <input type="file" id="file-input" class="hidden" accept="image/*,.pdf">
                    <div class="text-indigo-500 mb-2">
                        <svg class="w-8 h-8 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    </div>
                    <p class="text-[10px] font-bold text-slate-500 uppercase">Klik / Tarik File</p>
                </div>
            </div>

            <div id="action-buttons" class="mt-6 space-y-3 pt-6 border-t border-slate-200">
                <button id="btn-download-comp" class="hidden w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-blue-700 active:scale-95 transition-all text-sm uppercase tracking-widest">Unduh Kompresi</button>
                <button id="btn-download-img" class="hidden w-full bg-purple-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-purple-700 active:scale-95 transition-all text-sm uppercase tracking-widest">Unduh Versi Gambar</button>
            </div>
        </div>

        <div id="preview-section" class="flex-1 bg-slate-200 overflow-hidden flex flex-col relative">
            <div id="pdf-controls" class="hidden sticky top-0 p-4 bg-white/90 backdrop-blur border-b flex justify-between items-center shadow-sm z-30">
                <button id="prev-page" class="p-2.5 bg-slate-100 rounded-full hover:bg-indigo-100 text-indigo-600 transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
                <span id="page-info" class="text-xs font-black text-slate-700 uppercase tracking-widest">Halaman 0 / 0</span>
                <button id="next-page" class="p-2.5 bg-slate-100 rounded-full hover:bg-indigo-100 text-indigo-600 transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 md:p-12 flex flex-col items-center custom-scrollbar">
                <div id="preview-wrapper" class="bg-white shadow-2xl rounded-sm max-w-full">
                    <div class="p-20 text-slate-400 text-center italic font-medium">Belum ada dokumen dimuat</div>
                </div>
            </div>
        </div>
    </div>

<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs';

let currentFile = null;
let pdfDoc = null;
let currentPage = 1;

// --- RENDER PDF LOGIC ---
async function renderPdfPage(num) {
	const settings = window.getSettings();
	const page = await pdfDoc.getPage(num);
	const viewport = page.getViewport({ scale: settings.pdfScale });

	const wrapper = document.getElementById('preview-wrapper');
	wrapper.innerHTML = ''; 

	const canvas = document.createElement('canvas');
	canvas.id = "target-render";
	const context = canvas.getContext('2d');
	canvas.height = viewport.height;
	canvas.width = viewport.width;

	await page.render({ canvasContext: context, viewport }).promise;
	wrapper.appendChild(canvas);

	document.getElementById('page-info').innerText = `Halaman ${num} / ${pdfDoc.numPages}`;
	currentPage = num;

	if (window.innerWidth < 768) {
		document.getElementById('preview-section').scrollIntoView({ behavior: 'smooth' });
	}
}

window.getSettings = () => {
	const val = document.querySelector('input[name="lvl"]:checked')?.value || 'med';
	return {
		low:  { imgMB: 2, pdfOpt: false, pdfScale: 2.0, capQual: 1.0 },
		med:  { imgMB: 0.8, pdfOpt: true, pdfScale: 1.5, capQual: 0.8 },
		high: { imgMB: 0.2, pdfOpt: true, pdfScale: 1.1, capQual: 0.6 }
	}[val];
};

// --- DOM INIT & FILE HANDLING ---
window.addEventListener('DOMContentLoaded', () => {
	const app = document.getElementById('app');
	const fileInput = document.getElementById('file-input');
	const dropZone = document.getElementById('drop-zone');

	if (app) app.classList.remove('hidden');

	if (dropZone && fileInput) {
		dropZone.onclick = () => fileInput.click();
		fileInput.onchange = async (e) => {
			currentFile = e.target.files[0];
			if (!currentFile) return;

			Swal.fire({ title: 'Memproses...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });

			if (currentFile.type === 'application/pdf') {
				const arrayBuffer = await currentFile.arrayBuffer();
				pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
				document.getElementById('pdf-controls').classList.remove('hidden');
				document.getElementById('btn-download-img').classList.remove('hidden');
				document.getElementById('btn-download-comp').classList.remove('hidden');
				await renderPdfPage(1);
			} else if (currentFile.type.startsWith('image/')) {
				document.getElementById('pdf-controls').classList.add('hidden');
				document.getElementById('btn-download-img').classList.add('hidden');
				document.getElementById('btn-download-comp').classList.remove('hidden');
				const url = URL.createObjectURL(currentFile);
				document.getElementById('preview-wrapper').innerHTML = `<img src="${url}" id="target-render" class="max-w-full h-auto shadow-2xl">`;
				if (window.innerWidth < 768) document.getElementById('preview-section').scrollIntoView({ behavior: 'smooth' });
			}
			Swal.close();
		};
	}

	// --- DOWNLOAD ACTIONS ---
	document.getElementById('prev-page').onclick = () => { if (currentPage > 1) renderPdfPage(currentPage - 1); };
	document.getElementById('next-page').onclick = () => { if (currentPage < pdfDoc.numPages) renderPdfPage(currentPage + 1); };

	document.getElementById('btn-download-comp').onclick = async () => {
		const settings = window.getSettings();
		Swal.fire({ title: 'Mengompresi...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
		try {
			let resultBlob;
			if (currentFile.type === 'application/pdf') {
				const existingBytes = await currentFile.arrayBuffer();
				const pdfDocLib = await PDFLib.PDFDocument.load(existingBytes);
				const pdfBytes = await pdfDocLib.save({ useObjectStreams: settings.pdfOpt });
				resultBlob = new Blob([pdfBytes], { type: 'application/pdf' });
			} else {
				resultBlob = await window.imageCompression(currentFile, { maxSizeMB: settings.imgMB });
			}
			const url = URL.createObjectURL(resultBlob);
			const link = document.createElement('a');
			link.href = url;
			link.download = `compressed_${currentFile.name}`;
			link.click();
			Swal.close();
		} catch (e) { Swal.fire('Error', 'Gagal kompresi: ' + e.message, 'error'); }
	};

	document.getElementById('btn-download-img').onclick = async () => {
		const target = document.getElementById('target-render');
		const settings = window.getSettings();
		Swal.fire({ title: 'Menyimpan Gambar...', didOpen: () => Swal.showLoading() });
		try {
			const dataUrl = await modernScreenshot.domToJpeg(target, { quality: settings.capQual });
			const link = document.createElement('a');
			link.href = dataUrl;
			link.download = `Page_${currentPage}.jpg`;
			link.click();
			Swal.close();
		} catch (e) { Swal.fire('Error', 'Gagal konversi', 'error'); }
	};
});
</script>
</body>
</html>
